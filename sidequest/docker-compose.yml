services:
  db:
    image: postgres:16-alpine
    container_name: sidequest_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sidequest
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sidequest_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/sidequest
      SECRET_KEY: ucu-sidequest-dev-insecure-secret-key-change-in-prod-2026-minimum-32-chars
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
      APP_TIMEZONE: Europe/Kyiv
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      COGNITO_DOMAIN: ${COGNITO_DOMAIN:-}
      GOOGLE_SIGNIN_ENABLED: ${GOOGLE_SIGNIN_ENABLED:-false}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python seed.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_GOOGLE_SIGNIN_ENABLED: ${NEXT_PUBLIC_GOOGLE_SIGNIN_ENABLED:-false}
        NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${NEXT_PUBLIC_COGNITO_USER_POOL_ID:-}
        NEXT_PUBLIC_COGNITO_CLIENT_ID: ${NEXT_PUBLIC_COGNITO_CLIENT_ID:-}
        NEXT_PUBLIC_COGNITO_DOMAIN: ${NEXT_PUBLIC_COGNITO_DOMAIN:-}
        NEXT_PUBLIC_COGNITO_REDIRECT_URI: ${NEXT_PUBLIC_COGNITO_REDIRECT_URI:-http://localhost:3000/auth/callback}
        NEXT_PUBLIC_COGNITO_LOGOUT_URI: ${NEXT_PUBLIC_COGNITO_LOGOUT_URI:-http://localhost:3000/login}
        NEXT_PUBLIC_COGNITO_SCOPES: ${NEXT_PUBLIC_COGNITO_SCOPES:-openid email profile}
    container_name: sidequest_frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_GOOGLE_SIGNIN_ENABLED: ${NEXT_PUBLIC_GOOGLE_SIGNIN_ENABLED:-false}
      NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${NEXT_PUBLIC_COGNITO_USER_POOL_ID:-}
      NEXT_PUBLIC_COGNITO_CLIENT_ID: ${NEXT_PUBLIC_COGNITO_CLIENT_ID:-}
      NEXT_PUBLIC_COGNITO_DOMAIN: ${NEXT_PUBLIC_COGNITO_DOMAIN:-}
      NEXT_PUBLIC_COGNITO_REDIRECT_URI: ${NEXT_PUBLIC_COGNITO_REDIRECT_URI:-http://localhost:3000/auth/callback}
      NEXT_PUBLIC_COGNITO_LOGOUT_URI: ${NEXT_PUBLIC_COGNITO_LOGOUT_URI:-http://localhost:3000/login}
      NEXT_PUBLIC_COGNITO_SCOPES: ${NEXT_PUBLIC_COGNITO_SCOPES:-openid email profile}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
