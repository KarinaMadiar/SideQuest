services:
  db:
    image: postgres:16-alpine
    container_name: sidequest_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sidequest
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sidequest_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/sidequest
      SECRET_KEY: ucu-sidequest-dev-insecure-secret-key-change-in-prod-2026-minimum-32-chars
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
      APP_TIMEZONE: Europe/Kyiv
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python seed.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sidequest_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
